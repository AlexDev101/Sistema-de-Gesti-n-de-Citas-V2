# Workflow de GitHub Actions (lint, tipos, tests y build).
# Para activarlo, cópialo a .github/workflows/ci.yml. Subirlo con git exige un
# token con permiso `workflow`; lo más fácil es crearlo desde la web de GitHub
# (Add file → Create new file → .github/workflows/ci.yml) y pegar este contenido.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # El build no consulta la base: basta con valores de forma válida.
          NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: clave-de-ejemplo
